openapi: 3.0.3
info:
  title: Help Desk API
  description: API REST para gerenciamento de chamados de suporte de TI.
  version: 1.0.0
servers:
  - url: /
    description: Servidor atual
paths:
  /health:
    get:
      summary: Verificação de saúde da aplicação
      description: Retorna o status de integridade do serviço da API.
      responses:
        '200':
          description: Serviço operando normalmente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Autenticar usuário
      description: Realiza login com e-mail e senha e retorna token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@admin.com
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIs...
        '401':
          description: Credenciais inválidas ou usuário inativo
  /auth/forgot-password:
    post:
      tags:
        - Autenticação
      summary: Solicitar recuperação de senha
      description: Envia um e-mail com token seguro para redefinição de senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Instruções enviadas se o e-mail existir
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Se o e-mail estiver cadastrado, as instruções serão enviadas.
  /auth/reset-password:
    post:
      tags:
        - Autenticação
      summary: Redefinir senha com token
      description: Redefine a senha de um usuário utilizando o token recebido por e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  example: NovaSenha123!
      responses:
        '200':
          description: Senha redefinida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Senha redefinida com sucesso!
        '400':
          description: Token inválido ou expirado
  /auth/me:
    get:
      tags:
        - Autenticação
      summary: Obter dados do usuário logado
      description: Requer um token JWT válido.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil do usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
              example:
                id: 00000000-0000-0000-0000-000000000000
                name: Administrador
                email: admin@admin.com
                roles: [ADMIN]
        '401':
          description: Não autenticado
  /users:
    post:
      tags:
        - Usuários
      summary: Criar usuário (Admin)
      description: Requer autenticação com perfil ADMIN. Envia um token de configuração de senha por e-mail.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  example: Carlos Silva
                email:
                  type: string
                  format: email
                  example: carlos@empresa.com
                roles:
                  type: array
                  items:
                    type: string
                    enum: [USER, AGENT, ADMIN]
                  default: [USER]
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
              example:
                id: 00000000-0000-0000-0000-000000000000
                name: Carlos Silva
                email: carlos@empresa.com
                roles: [USER]
        '400':
          description: Dados de entrada inválidos
        '403':
          description: Acesso restrito a administradores
        '409':
          description: E-mail já cadastrado
    get:
      tags:
        - Usuários
      summary: Listar usuários (Admin)
      description: Requer autenticação com perfil ADMIN.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: active
          schema:
            type: boolean
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          description: Acesso restrito a administradores
  /users/{id}:
    get:
      tags:
        - Usuários
      summary: Buscar usuário por ID (Admin)
      description: Requer autenticação com perfil ADMIN.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '404':
          description: Usuário não encontrado
    put:
      tags:
        - Usuários
      summary: Atualizar usuário (Admin)
      description: Requer autenticação com perfil ADMIN.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                roles:
                  type: array
                  items:
                    type: string
                    enum: [USER, AGENT, ADMIN]
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '404':
          description: Usuário não encontrado
  /users/{id}/active:
    patch:
      tags:
        - Usuários
      summary: Ativar ou desativar usuário (Admin)
      description: Requer autenticação com perfil ADMIN. A desativação preserva o histórico do usuário.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        '204':
          description: Status de ativação atualizado
  /categories:
    get:
      tags:
        - Categorias
      summary: Listar categorias
      description: Retorna as categorias de chamados cadastradas no sistema.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: active
          schema:
            type: boolean
          description: Filtrar por status ativo/inativo
        - in: query
          name: search
          schema:
            type: string
          description: Busca por nome ou descrição
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySummary'
    post:
      tags:
        - Categorias
      summary: Criar nova categoria (Admin)
      description: Cadastra uma nova categoria de chamado no sistema. Requer autenticação com perfil ADMIN.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Redes e Conectividade
                description:
                  type: string
                  example: Problemas relacionados a conexão de rede ou Wi-Fi
                active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Categoria criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySummary'
        '400':
          description: Erro de validação
        '409':
          description: Categoria já existente com este nome
  /categories/{id}:
    get:
      tags:
        - Categorias
      summary: Obter detalhes da categoria
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da categoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySummary'
        '404':
          description: Categoria não encontrada
    put:
      tags:
        - Categorias
      summary: Atualizar categoria (Admin)
      description: Atualiza ou desativa uma categoria. Requer autenticação com perfil ADMIN.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                active:
                  type: boolean
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySummary'
        '404':
          description: Categoria não encontrada
        '409':
          description: Conflito de nome duplicado
  /tickets:
    get:
      tags:
        - Chamados
      summary: Listar chamados
      description: Lista chamados com paginação e filtros. Usuários comuns visualizam apenas seus próprios chamados; agentes e administradores podem atuar nos chamados destinados ao atendimento.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, WAITING_USER, RESOLVED, CLOSED]
        - in: query
          name: priority
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: requesterId
          schema:
            type: string
            format: uuid
        - in: query
          name: assignedUserId
          schema:
            type: string
            format: uuid
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de chamados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketSummary'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
    post:
      tags:
        - Chamados
      summary: Abrir um novo chamado
      description: Usuário autenticado registra um chamado no suporte.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, categoryId]
              properties:
                title:
                  type: string
                  example: Computador não liga
                description:
                  type: string
                  example: Ao apertar o botão liga/desliga, nada acontece.
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                  default: MEDIUM
                categoryId:
                  type: string
                  format: uuid
                dueDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Chamado criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummary'
              example:
                id: 00000000-0000-0000-0000-000000000000
                title: Computador não liga
                status: OPEN
                priority: MEDIUM
                requesterId: 00000000-0000-0000-0000-000000000001
                categoryId: 00000000-0000-0000-0000-000000000002
        '400':
          description: Categoria inativa ou dados inválidos
        '404':
          description: Categoria não encontrada
  /tickets/{id}:
    get:
      tags:
        - Chamados
      summary: Obter detalhes do chamado
      description: Usuários comuns acessam apenas seus próprios chamados; agentes e administradores acessam chamados destinados ao atendimento.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes completos do chamado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '403':
          description: Usuário não tem permissão para visualizar este chamado
        '404':
          description: Chamado não encontrado
    put:
      tags:
        - Chamados
      summary: Atualizar chamado
      description: Atualiza campos permitidos de acordo com o perfil do solicitante.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                categoryId:
                  type: string
                  format: uuid
                dueDate:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Chamado atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummary'
        '400':
          description: Chamado fechado não pode ser alterado
        '403':
          description: Permissão negada
        '404':
          description: Chamado ou categoria não encontrados
  /tickets/{id}/assign:
    patch:
      tags:
        - Chamados
      summary: Atribuir ou remover responsável do chamado (Agente / Admin)
      description: "Requer autenticação com perfil AGENT ou ADMIN. Envie `assignedUserId: null` para remover o responsável."
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedUserId]
              properties:
                assignedUserId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Responsável atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummary'
        '400':
          description: Usuário não possui perfil de atendimento ou está inativo
        '403':
          description: Restrito a agentes e administradores
  /tickets/{id}/status:
    patch:
      tags:
        - Chamados
      summary: Atualizar status do chamado (Agente / Admin)
      description: Requer autenticação com perfil AGENT ou ADMIN.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [OPEN, IN_PROGRESS, WAITING_USER, RESOLVED, CLOSED]
      responses:
        '200':
          description: Status atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummary'
        '400':
          description: Status inválido
        '403':
          description: Restrito a agentes e administradores
  /tickets/{ticketId}/comments:
    get:
      tags:
        - Comentários
      summary: Listar comentários de um chamado
      description: Usuários comuns acessam comentários dos próprios chamados; agentes e administradores acessam chamados destinados ao atendimento.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de comentários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '403':
          description: Permissão negada
        '404':
          description: Chamado não encontrado
    post:
      tags:
        - Comentários
      summary: Adicionar comentário em um chamado
      description: Usuário autorizado adiciona um comentário. Comentários são imutáveis após a criação.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  example: Testei o cabo de energia e agora deu sinal.
      responses:
        '201':
          description: Comentário adicionado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Chamado encerrado não aceita novos comentários
        '403':
          description: Permissão negada
        '404':
          description: Chamado não encontrado
  /tickets/comments/{id}:
    get:
      tags:
        - Comentários
      summary: Obter um comentário por ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comentário com seus anexos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403':
          description: Permissão negada
        '404':
          description: Comentário ou chamado associado não encontrado
  /tickets/{ticketId}/events:
    get:
      tags:
        - Histórico e Auditoria
      summary: Obter histórico de eventos do chamado
      description: Consulta disponível para usuários autorizados ao chamado. Os eventos são preservados para auditoria.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista cronológica de eventos de auditoria do chamado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketEvent'
        '403':
          description: Permissão negada
        '404':
          description: Chamado não encontrado
  /attachments/tickets/{ticketId}:
    post:
      tags:
        - Anexos
      summary: Enviar anexo para um chamado
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Arquivo enviado com sucesso e armazenado no Cloudinary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Attachment'
        '400':
          description: Arquivo ausente ou chamado encerrado
        '403':
          description: Permissão negada
        '404':
          description: Chamado não encontrado
    get:
      tags:
        - Anexos
      summary: Listar anexos de um chamado
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de anexos do chamado com URLs seguras
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
  /attachments/comments/{commentId}:
    post:
      tags:
        - Anexos
      summary: Enviar anexo para um comentário (Cloudinary)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Arquivo enviado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Attachment'
        '400':
          description: Arquivo ausente ou chamado encerrado
    get:
      tags:
        - Anexos
      summary: Listar anexos de um comentário
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de anexos do comentário com URLs seguras
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
        '403':
          description: Permissão negada
        '404':
          description: Comentário ou chamado associado não encontrado
  /attachments/{id}:
    delete:
      tags:
        - Anexos
      summary: Excluir um anexo
      description: Remove o anexo quando o usuário possui autorização sobre o chamado ou comentário associado e o chamado ainda permite alterações.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Anexo removido com sucesso
        '403':
          description: Permissão negada
        '404':
          description: Anexo não encontrado
  /notifications:
    get:
      tags:
        - Notificações
      summary: Listar notificações do usuário autenticado
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: unreadOnly
          schema:
            type: boolean
        - in: query
          name: channel
          schema:
            type: string
            enum: [IN_APP, EMAIL]
            default: IN_APP
      responses:
        '200':
          description: Lista paginada de notificações com contador de não lidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /notifications/{id}/read:
    patch:
      tags:
        - Notificações
      summary: Marcar notificação como lida
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notificação marcada como lida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Notification'
        '404':
          description: Notificação não encontrada
  /notifications/read-all:
    patch:
      tags:
        - Notificações
      summary: Marcar todas as notificações do usuário como lidas
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [IN_APP, EMAIL]
      responses:
        '200':
          description: Quantidade de notificações atualizadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: integer
                    example: 2
  /notifications/trigger-job:
    post:
      tags:
        - Notificações
      summary: Executar imediatamente lote de envio de e-mails com retry (Admin)
      description: Requer autenticação com perfil ADMIN. Processa notificações por e-mail pendentes ou elegíveis para nova tentativa.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Resultado do processamento do lote
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      processed:
                        type: integer
                      succeeded:
                        type: integer
                      failed:
                        type: integer
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 3
        totalPages:
          type: integer
          example: 1
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        content:
          type: string
          example: Iniciei a análise do chamado.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TicketEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          example: STATUS_CHANGED
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          example: STATUS_CHANGED
        channel:
          type: string
          enum: [IN_APP, EMAIL]
        status:
          type: string
          enum: [PENDING, PROCESSING, DELIVERED, FAILED]
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Token JWT para autenticação nas rotas protegidas
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string

    CategorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    TicketSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, WAITING_USER, RESOLVED, CLOSED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        requesterId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        assignedUserId:
          type: string
          format: uuid
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        requester:
          $ref: '#/components/schemas/UserSummary'
        assignedUser:
          $ref: '#/components/schemas/UserSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'

    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          properties:
            attachments:
              type: array
              description: Anexos diretamente associados ao chamado
              items:
                $ref: '#/components/schemas/Attachment'
            comments:
              type: array
              description: Lista cronológica de comentários do chamado
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  content:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  user:
                    $ref: '#/components/schemas/UserSummary'
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
            events:
              type: array
              description: Linha do tempo de eventos de auditoria do chamado
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  type:
                    type: string
                  metadata:
                    type: object
                  createdAt:
                    type: string
                    format: date-time
                  user:
                    $ref: '#/components/schemas/UserSummary'
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
