# Identificação no SonarCloud / SonarQube
sonar.projectKey=ThawanVCSantos_helpdesk-api
sonar.organization=thawanvcsantos

sonar.projectName=Help Desk API
sonar.projectVersion=1.0.0

# Configurações de fontes de código
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusões gerais
sonar.exclusions=node_modules/**,coverage/**,dist/**,docs/**,postman/**,prisma/**

# Relatórios de Testes e Cobertura (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=tests/**,src/index.js,src/main/server.js,prisma.config.js,eslint.config.js,vitest.config.js

